<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/normalize.css" />
  <body>
    <form>
      <fieldset>
        <legend>Ваши личные данные</legend>
        <label for="name">Ваше имя</label>
        <input id="name" type="text" placeholder="Имя" required />

        <label for="age">Ваш возраст</label>
        <input id="age" type="number" placeholder="Возраст" required />

        <label for="tel">Ваш номер телефона</label>
        <input id="tel" type="tel" placeholder="Номер телефона" required />

        <label for="email">Ваша почта</label>
        <input id="email" type="email" placeholder="Почта" required />

        <label for="message">Сообщение</label>
        <textarea id="message" placeholder="Ваше сообщение" required></textarea>

        <input id="approval" type="checkbox" />
        <label for="approval" class="approval-label" required
          >Я принимаю правила</label
        >

        <button>Отправить</button>
      </fieldset>
    </form>
  </body>
</html>
