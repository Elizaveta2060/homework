<!doctype html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <link
      rel="shortcut icon"
      href="./icons/nike_logo_icon.ico"
      type="image/x-icon"
    />
    <title>Nike Air Mag</title>
  </head>
  <body class="page__body">
    <header class="header header--fixed">
      <div class="container header__container">
        <a class="logo header__logo" href="#">
          <img
            src="./icons/logo-icons.svg"
            width="50"
            height="20"
            alt="логотип nike"
          />
        </a>
        <nav class="menu header__menu" aria-label="Главное меню">
          <ul class="menu__list">
            <li class="menu__item">
              <a class="menu__link" href="#air-mag" lang="en">Air Mag</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#sizec">Размеры</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#characteristics">Характеристики</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#top-models">Другие ТОП модели</a>
            </li>
          </ul>
        </nav>
        <div class="header_controls">
          <a class="header_order" href="#">Сделать заказ</a>
          <div class="header__actions">
            <button
              class="header__button-actions"
              title="Поиск"
              aria-label="Поиск"
            >
              <svg width="24" height="24">
                <use
                  class="header__actions-icons"
                  href="./icons/sprite.svg#search"
                ></use>
              </svg>
            </button>

            <button
              class="header__button-actions"
              title="Корзина"
              aria-label="Корзина"
            >
              <svg width="24" height="24">
                <use
                  class="header__actions-icons"
                  href="./icons/sprite.svg#cart"
                ></use>
              </svg>
            </button>
            <button class="header__bruger bruger" aria-label="Открыть меню">
              <swg width="24" height="24">
                <use
                  class="burger__icon-menu"
                  href="./icons/sprite.svg#menu-burger"
                ></use>
                <use
                  class="burger__icon-cross"
                  href="./icons/sprite.svg#menu-cross"
                ></use>
              </swg>
            </button>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
